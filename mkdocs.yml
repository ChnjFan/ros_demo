# MkDocs 站点配置
# 本地预览：mkdocs serve
# 线上部署：.github/workflows/deploy-docs.yml（推送到 main 触发）

site_name: ROS Demo 学习笔记
site_description: 基于 catkin 工作空间的 ROS 1 入门学习工程 —— 中文教程、架构详解、通信原理与命令速查
site_url: https://chnjfan.github.io/ros_demo/
repo_url: https://github.com/ChnjFan/ros_demo
repo_name: ChnjFan/ros_demo
edit_uri: edit/main/docs/
copyright: Copyright &copy; ChnjFan

theme:
  name: material
  language: zh
  # 关闭 Google Fonts：Roboto 本身不含中文字形，交给系统字体反而更快，
  # 也避免 fonts.googleapis.com 在部分网络下加载失败拖慢首屏。
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.select
    - content.tabs.link

plugins:
  - search:
      # 中文分词 + 英文术语（rostopic / catkin_make 之类）都要能搜到
      lang:
        - zh
        - en

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

validation:
  nav:
    # nav 里引用了不存在的页面 → 直接让 CI 失败
    not_found: warn
  links:
    # 教程总目录里有 40+ 个「待撰写」章节的链接，目标文件尚未创建，
    # 这里降为 info 以免 mkdocs build --strict 失败；
    # 等章节补齐后可以改回 warn，让 CI 重新把关内部链接。
    not_found: info
    # 锚点写错（#section 对不上）仍然当作错误
    anchors: warn

nav:
  - 首页: index.md
  - 教程:
      - 教程总目录: tutorial/index.md
      - 第 1 章 · ROS 概述与环境搭建:
          - 1.1 ROS 简介: tutorial/chapter01/01-introduction.md
          - 1.2 ROS 安装: tutorial/chapter01/02-installation.md
          - 1.3 ROS 快速体验: tutorial/chapter01/03-helloworld.md
          - 1.4 集成开发环境搭建: tutorial/chapter01/04-ide-setup.md
          - 1.5 ROS 架构: tutorial/chapter01/05-architecture.md
      - 第 2 章 · ROS 通信机制:
          - 2.1 话题通信: tutorial/chapter02/06-topic.md
          - 2.2 服务通信: tutorial/chapter02/07-service.md
          - 2.3 参数服务器: tutorial/chapter02/08-parameter.md
  - 参考手册:
      - ROS 架构详解: arch.md
      - ROS 1 通信机制详解: comm.md
      - ROS 常用命令速查手册: ros_cmd.md
      - Docker Compose 开发环境: docker.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ChnjFan/ros_demo
