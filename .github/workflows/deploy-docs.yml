name: Deploy docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements.txt'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

# GitHub Pages 部署所需的权限，缺一不可
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署；已排队的任务不取消，避免线上站点停在半成品状态
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Material 的版权/修订日期取自 git 历史，浅克隆会导致取不到
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 构建站点
        # --strict：把警告当作错误，链接写错 / nav 里引用了不存在的页面都会让 CI 失败。
        # 教程中「待撰写」章节的链接已在 mkdocs.yml 的 validation 里降级为 info。
        run: mkdocs build --strict

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      # 关键：deploy-pages 成功 ≠ 线上就是本次的产物。
      # 如果 Settings → Pages 的 Source 还停在 "Deploy from a branch"，
      # GitHub 会同时跑内置的 Jekyll 构建（workflow 名 "pages build and deployment"），
      # 它后完成、会把 MkDocs 产物整个覆盖掉，而本工作流依然是一片绿。
      # 这里用 MkDocs 专有路径做冒烟测试，把这种静默失败变成明确的红色报错。
      - name: 冒烟测试：确认线上就是本次构建的 MkDocs 产物
        run: |
          base="${{ steps.deployment.outputs.page_url }}"
          probe="${base}search/search_index.json"
          for attempt in 1 2 3 4 5; do
            sleep 10
            code=$(curl -s -o /dev/null -w '%{http_code}' -L "$probe" || echo 000)
            echo "第 $attempt 次探测：$probe -> HTTP $code"
            if [ "$code" = "200" ]; then
              echo "✅ 线上已是 MkDocs 产物"
              exit 0
            fi
          done
          echo "::error title=线上不是 MkDocs 产物::${probe} 始终不是 200。若线上仍是 Jekyll 生成的 *.html 页面，请到 Settings → Pages → Build and deployment → Source 选择 'GitHub Actions'，否则内置 Jekyll 构建会一直覆盖本工作流的部署，然后重新运行本工作流。"
          exit 1
