# Jekyll 站点配置（GitHub Pages）
# 主题：just-the-docs —— 专为文档站设计，带侧边栏导航和搜索
# 注意：GitHub Pages 环境未内置 just-the-docs gem，
# 必须用 remote_theme（构建时从 GitHub 拉取主题），不能用 theme
title: ROS Demo 学习笔记
description: ROS 1 入门学习工程 —— 架构、通信机制与常用命令系统文档
remote_theme: just-the-docs/just-the-docs

# 站点 URL（部署后替换为你的实际地址，本地预览可注释掉）
baseurl: "/ros_demo"          # 若部署到 https://<user>.github.io/ros_demo/ 则取消注释
# url: "https://<user>.github.io"

# 顶部右上角外部链接
aux_links:
  "GitHub 仓库":
    - "https://github.com/ChnjFan/ros_demo"

# 启用站内搜索（注：对中文分词支持有限，英文关键词搜索效果好）
search_enabled: true

# 标题锚点
heading_anchors: true

# 页脚（可自定义）
footer_content: 'Copyright &copy; 2026 ros_demo &mdash; <a href="https://github.com/ChnjFan/ros_demo">GitHub</a>'

# Markdown 引擎（GitHub Pages 默认）
markdown: kramdown

# 排除无需编译的文件
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md
